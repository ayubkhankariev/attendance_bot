# ============================================================
#  TTPU Monitor — конфигурация
#  Скопируйте этот файл в config.yaml и заполните свои данные
# ============================================================

telegram:
  # Токен бота — получить у @BotFather в Telegram
  bot_token: "1234567890:AAAA-ВСТАВЬТЕ-СВОЙ-ТОКЕН"

  # ID группы руководителей (куда отправляются финальные отчёты).
  # Добавьте бота в группу и напишите там /id — бот покажет ID (обычно начинается с -100)
  target_chat_id: -1001234567890

  # ID вашего личного чата с ботом (режим проверки). Напишите боту /id в личку.
  review_chat_id: 123456789

  # Кому разрешено пользоваться ботом (команды, кнопки меню, /check и т.д.).
  # Все остальные получат отказ в доступе. Команда /id работает для всех —
  # она как раз нужна, чтобы узнать свой chat_id и вписать сюда.
  # Если не указано — по умолчанию доступ только у review_chat_id.
  admin_chat_ids: [123456789]

  # ID групп, в которых разрешено пользоваться ботом (обычно начинается с -100).
  # Управляется главным администратором через меню «Настройки».
  allowed_group_ids: []

  # Режим работы:
  #   review — бот сначала присылает фото ВАМ с кнопками (✅ отправить, ➕/➖ исправить число, ⏭ пропустить),
  #            и только после вашего подтверждения публикует в группу руководителей. РЕКОМЕНДУЕТСЯ для начала.
  #   auto   — бот отправляет в группу руководителей сразу, без подтверждения.
  mode: review

timezone: "Asia/Tashkent"

# Рабочие дни: 0=Пн, 1=Вт, 2=Ср, 3=Чт, 4=Пт, 5=Сб, 6=Вс
working_days: [0, 1, 2, 3, 4, 5]

edupage:
  # поддомен школы: https://ttpu.edupage.org  ->  "ttpu"
  school: "ttpu"

# Время начала пар (как в расписании TTPU)
periods:
  1: "09:00"
  2: "10:30"
  3: "12:00"
  4: "14:20"
  5: "15:50"
  6: "17:20"
  7: "18:50"
  8: "20:20"

# Через сколько минут после начала пары делать проверку (вы делаете через 5-10 минут)
check_offset_minutes: 10

# Отдельная быстрая проверка присутствия через N минут после начала пары —
# если на фото совсем никого нет, придёт предупреждение вам в личку.
# Чтобы оставить только одну проверку в начале урока, поставьте null.
# Это удобно, если вам не нужна вторая проверка после 5-10 минут.
presence_check_minutes: null

# Утром бот пришлёт вам план на день: какие пары будут проверены,
# и для каких аудиторий нет камеры. Поставьте null чтобы отключить.
day_plan_time: "08:30"

rules:
  # Если студентов меньше этого числа — добавляется хештег #TALABALARSONI N/M
  min_students: 10
  low_hashtag: "#TALABALARSONI"
  # Если в аудитории вообще никого нет
  empty_hashtag: "#DARSBARBOD"
  # Считать, что среди найденных на фото людей один — преподаватель
  # (тогда студенты = найдено людей - 1). В режиме review вы всё равно можете поправить число.
  assume_teacher_in_count: true
  # Для этих групп малое число студентов — норма (например, гибридный формат
  # магистратуры), а не нарушение: вместо low_hashtag ставится hybrid_hashtag.
  hybrid_hashtag: "#HYBRID"
  hybrid_groups: []

counting:
  # Автоматический подсчёт людей на фото (нейросеть YOLO).
  # false = бот просто отправляет фото с подписью, число студентов вы ставите кнопками ➕/➖
  enabled: true
  # yolov8n.pt — быстрее, yolov8s.pt — точнее, yolov8m.pt — ещё точнее, но медленнее
  # (скачивается автоматически при первом запуске)
  model: "yolov8m.pt"
  confidence: 0.35

# ------------------------------------------------------------
# КАМЕРЫ: аудитория -> адрес снимка
# Ключ = название аудитории ТОЧНО как в расписании EduPage (LAB 406, 203, 201 ...)
#
# Вариант 1 (камера напрямую, Hikvision):
#   http://IP_КАМЕРЫ/ISAPI/Streaming/channels/101/picture
# Вариант 2 (через регистратор NVR, канал N):
#   http://IP_РЕГИСТРАТОРА/ISAPI/Streaming/channels/N01/picture   (канал 4 -> 401)
# Вариант 3 (если ISAPI не работает — RTSP-поток):
#   rtsp://логин:пароль@IP:554/Streaming/Channels/101
# Вариант 4 (локальная USB-камера — для тестов без настоящих камер):
#   type: webcam
#   index: 0
#
# IP камер/регистраторов смотрите в iVMS-4200: Device Management -> Device
# ------------------------------------------------------------
cameras:
  "LAB 406":
    url: "http://192.168.1.101/ISAPI/Streaming/channels/101/picture"
    username: "admin"
    password: "пароль"
    # Можно переопределить параметры детекции только для этой аудитории:
    # если фото здесь хуже/чуть размазанное, детектор можно сделать аккуратнее.
    counting:
      model: "yolov8m.pt"
      confidence: 0.28
      imgsz: 1440
      iou: 0.45
      augment: true
  "LAB 403":
    url: "http://192.168.1.102/ISAPI/Streaming/channels/101/picture"
    username: "admin"
    password: "пароль"
  "201":
    url: "http://192.168.1.60/ISAPI/Streaming/channels/201/picture"   # пример: NVR, канал 2
    username: "admin"
    password: "пароль"
  "203":
    url: "http://192.168.1.60/ISAPI/Streaming/channels/301/picture"   # пример: NVR, канал 3
    username: "admin"
    password: "пароль"

# Если название в расписании отличается от ключа камеры — задайте синонимы
room_aliases:
  "LAB406": "LAB 406"
  "LAB403": "LAB 403"
  "BLEU HALL": "BLUE HALL"

# Сколько студентов ЧИСЛИТСЯ в каждой группе (для записи вида 5/58).
# Если группа не указана — бот напишет 5/?
group_sizes:
  IT1-24: 29
  IT2-24: 29
  AE1-24: 25
  AE2-24: 25
  CIE-24: 30
  IT1-23: 28
  IT2-23: 28
  SE-23: 27
